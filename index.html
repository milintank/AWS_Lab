<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Park Adventure</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Welcome to Splash Water Park 🌊</h1>
        <nav>
            <ul>
                <li><a href="#rides">Rides</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="rides">
        <h2>Our Exciting Water Rides 🚀</h2>
        <div class="ride">
            <img src="slide.jpg" alt="Water Slide">
            <p>The ultimate thrill of water sliding!</p>
        </div>
        <div class="ride">
            <img src="wave-pool.jpg" alt="Wave Pool">
            <p>Enjoy the artificial waves like a beach! 🏖️</p>
        </div>
    </section>

    <section id="contact">
        <h2>Contact Us 📞</h2>
        <form id="contactForm">
            <label for="name">Name:</label>
            <input type="text" id="name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <button type="submit">Submit</button>
        </form>
        <p id="message"></p>
    </section>

    <script src="script.js"></script>

</body>
</html>
